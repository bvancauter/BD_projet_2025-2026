services:
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: admin
      MYSQL_PASSWORD: password

    volumes:
      - ./data.sql:/docker-entrypoint-initdb.d/1_data.sql
      - ./triggers.sql:/docker-entrypoint-initdb.d/2_triggers.sql
      - ./views.sql:/docker-entrypoint-initdb.d/3_views.sql
      - ./permissions.sql:/docker-entrypoint-initdb.d/4_permissions.sql

  app:
    build:
      context: ./projet-bd
    container_name: spring-app

    ports:
      - "8081:8081"

    depends_on:
      - mysql

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydatabase
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
